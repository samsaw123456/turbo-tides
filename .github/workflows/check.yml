name: Check and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check fatJar
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install ruff==0.17.5
      - run: ruff check tools && ruff format --check tools
      - run: python3 -m py_compile tools/*.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/package_linux.py --skip-build
      - uses: actions/upload-artifact@v4
        with:
          name: turbo-tides-linux
          path: dist/*.tar.gz*
